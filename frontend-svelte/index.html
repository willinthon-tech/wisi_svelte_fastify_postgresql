    <!-- Suprimir advertencias benignas de Chrome DevTools y extensiones (Core Web Vitals / reportAllChanges VM) -->
    <script>
      (function() {
        var isIgnored = function(msg, url, stack) {
          var str = (String(msg || '') + ' ' + String(url || '') + ' ' + String(stack || '')).toLowerCase();
          return str.indexOf('reportallchanges') !== -1 ||
                 (str.indexOf('starttime') !== -1 && (str.indexOf('undefined') !== -1 || str.indexOf('null') !== -1 || str.indexOf('vm') !== -1 || str.indexOf('cannot read propert') !== -1));
        };

        // 1. Interceptar setTimeout para atrapar el error interno antes de que se convierta en Uncaught Exception
        try {
          var origST = window.setTimeout;
          window.setTimeout = function(fn, delay) {
            if (typeof fn === 'function') {
              var safeFn = function() {
                try {
                  return fn.apply(this, arguments);
                } catch (err) {
                  var errStr = String(err && (err.message || err.stack) || err || '').toLowerCase();
                  if (isIgnored(errStr, '', err && err.stack)) {
                    return; // Silenciar error benigno interno de Chrome DevTools / web-vitals
                  }
                  throw err;
                }
              };
              var args = Array.prototype.slice.call(arguments, 2);
              return origST.apply(this, [safeFn, delay].concat(args));
            }
            return origST.apply(this, arguments);
          };
        } catch (stErr) {}

        // 2. Interceptar requestIdleCallback si existe
        if (typeof window.requestIdleCallback === 'function') {
          try {
            var origRIC = window.requestIdleCallback;
            window.requestIdleCallback = function(fn, opts) {
              if (typeof fn === 'function') {
                var safeRIC = function() {
                  try {
                    return fn.apply(this, arguments);
                  } catch (err) {
                    var errStr = String(err && (err.message || err.stack) || err || '').toLowerCase();
                    if (isIgnored(errStr, '', err && err.stack)) {
                      return;
                    }
                    throw err;
                  }
                };
                return origRIC.call(this, safeRIC, opts);
              }
              return origRIC.apply(this, arguments);
            };
          } catch (ricErr) {}
        }

        // 3. Neutralizar 'soft-navigation' y proteger PerformanceObserver contra el bug interno de Chrome DevTools
        if (typeof window !== 'undefined' && window.PerformanceObserver) {
          try {
            var OrigPO = window.PerformanceObserver;

            // Filtrar 'soft-navigation' para que los scripts de DevTools crean que no está soportado
            var origSupported = OrigPO.supportedEntryTypes || [];
            var filteredSupported = [];
            for (var s = 0; s < origSupported.length; s++) {
              if (origSupported[s] !== 'soft-navigation') {
                filteredSupported.push(origSupported[s]);
              }
            }

            // Anular la observación de soft-navigation en el prototipo
            if (OrigPO.prototype && OrigPO.prototype.observe) {
              var origObserve = OrigPO.prototype.observe;
              OrigPO.prototype.observe = function(options) {
                if (options) {
                  if (options.type === 'soft-navigation') {
                    return;
                  }
                  if (Array.isArray(options.entryTypes)) {
                    options.entryTypes = options.entryTypes.filter(function(t) { return t !== 'soft-navigation'; });
                    if (options.entryTypes.length === 0) return;
                  }
                }
                return origObserve.apply(this, arguments);
              };
            }

            // Proteger getEntries de PerformanceObserverEntryList para que ningún entry tenga startTime indefinido
            if (typeof window.PerformanceObserverEntryList !== 'undefined' && window.PerformanceObserverEntryList.prototype) {
              var sanitizeEntries = function(list) {
                if (!list) return [];
                for (var j = 0; j < list.length; j++) {
                  if (list[j] && typeof list[j].startTime === 'undefined') {
                    try { list[j].startTime = 0; } catch (e) {}
                  }
                }
                return list;
              };
              var origELGet = window.PerformanceObserverEntryList.prototype.getEntries;
              if (origELGet) {
                window.PerformanceObserverEntryList.prototype.getEntries = function() {
                  return sanitizeEntries(origELGet.apply(this, arguments));
                };
              }
              var origELGetByType = window.PerformanceObserverEntryList.prototype.getEntriesByType;
              if (origELGetByType) {
                window.PerformanceObserverEntryList.prototype.getEntriesByType = function() {
                  return sanitizeEntries(origELGetByType.apply(this, arguments));
                };
              }
            }

            var PatchedPO = function(callback) {
              var safeCallback = function(list, observer) {
                try {
                  var entries = list && list.getEntries ? list.getEntries() : [];
                  if (!entries || entries.length === 0) return;
                  return callback.apply(this, arguments);
                } catch (err) {
                  var errStr = String(err && (err.message || err.stack) || err || '');
                  if (isIgnored(errStr, '', err && err.stack)) {
                    return;
                  }
                  throw err;
                }
              };
              var inst = new OrigPO(safeCallback);
              Object.setPrototypeOf(inst, PatchedPO.prototype);
              return inst;
            };

            PatchedPO.prototype = OrigPO.prototype;
            try {
              Object.defineProperty(PatchedPO, 'supportedEntryTypes', {
                configurable: true,
                enumerable: true,
                get: function() { return filteredSupported; }
              });
            } catch (propErr) {}
            window.PerformanceObserver = PatchedPO;
          } catch (poErr) {}
        }

        // 4. Filtro global de errores no capturados (window.onerror)
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isIgnored(msg || (error && error.message), url, error && error.stack)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
        };

        window.addEventListener('error', function(event) {
          if (isIgnored(event.message, event.filename, event.error && event.error.stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var r = event.reason;
          if (isIgnored(r && r.message, '', r && r.stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          var allArgs = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.stack) ? a.stack : String(a || '');
          }).join(' ');
          if (isIgnored(allArgs, '', '')) {
            return;
          }
          if (origConsoleError) {
            origConsoleError.apply(console, arguments);
          }
        };
      })();
    </script>
