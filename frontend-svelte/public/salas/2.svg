<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Tepui Plateau Silhouette (Mount Roraima) -->
  <path d="M 110 30 Q 115 16 125 15 L 185 15 Q 192 17 195 24 L 204 24 Q 210 15 218 15 L 246 15 Q 252 17 250 25 L 253 30" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Roraima Stylized Wordmark -->
  <text x="160" y="52" font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', cursive, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" filter="url(#glow)" letter-spacing="1">
    Roraima
  </text>

  <!-- Stars & CASINO Row -->
  <g transform="translate(0, 72)">
    <text x="120" y="0" font-size="14" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">★★★★★</text>
    <text x="195" y="-1" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3">CASINO</text>
  </g>

  <!-- RIF Subtitle -->
  <text x="160" y="94" font-family="'Inter', monospace, sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">
    RIF J-30606594-6
  </text>
</svg>
